spring.datasource.url=jdbc:h2:mem:tata;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

tata.omission.grace-period=PT0S
tata.omission.evaluation-initial-delay=PT24H
tata.intake.unconfirmed-initial-delay=PT24H

# Bound the wait for tests that serialize concurrent PIN verification.
spring.datasource.url=jdbc:h2:mem:tata;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Fixture key only; production requires its own externally supplied signing key.
tata.security.jwt.secret-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
tata.email.encryption.active-key-id=test
tata.email.encryption.keys.test=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
tata.email.dispatch-initial-delay=86400000

tata.omission.grace-period=PT0S
tata.omission.evaluation-initial-delay=PT24H
tata.intake.unconfirmed-evaluation-initial-delay=PT24H
tata.treatment.horizon-extension-cron=-

tata.notifications.dispatch-initial-delay=86400000

tata.notifications.recovery-initial-delay=86400000

# Keep inventory recovery deterministic in explicit integration tests.
tata.inventory.recovery-initial-delay=86400000

# Exercise initial stock recovery explicitly in transaction fixtures.
tata.family.stock-catchup-initial-delay=86400000

spring.application.name=Tata Web Services
tata.security.jwt.secret-base64=${TATA_JWT_SECRET_BASE64:}
tata.email.resend.api-key=${TATA_RESEND_API_KEY:}
tata.email.resend.sender=${TATA_RESEND_SENDER:}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.naming.physical-strategy=com.vitahealth.tata.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

tata.speech.google.enabled=${TATA_GOOGLE_SPEECH_ENABLED:false}

server.port=${PORT:8080}
spring.datasource.driver-class-name=org.postgresql.Driver

environment.name=prod
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Railway first boot: allow Hibernate to create/update tables. Switch to validate + Flyway for hardened releases.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
tata.security.require-authentication=${TATA_REQUIRE_AUTHENTICATION:true}
tata.cors.allowed-origins=${TATA_CORS_ALLOWED_ORIGINS:*}
